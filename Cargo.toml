[package]
name = "tokio-rustls-acme"
version = "0.9.0"
authors = [
    "dignifiedquire <me@dignifiedquire.com>",
    "Florian Uekermann <florian@uekermann.me>",
]
edition = "2018"
description = "Automatic TLS certificate management using rustls"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/n0-computer/tokio-rustls-acme"
documentation = "https://docs.rs/tokio-rustls-acme"
keywords = ["acme", "rustls", "tls", "letsencrypt"]
categories = ["asynchronous", "cryptography", "network-programming"]

[dependencies]
futures = "0.3.21"
rcgen = { version = "0.14", features = ["x509-parser", "crypto"] }
serde_json = "1.0.81"
serde = { version = "1.0.137", features = ["derive"] }
ring = { version = "0.17.0", features = ["std"] }
base64 = "0.22"
log = "0.4.17"
webpki-roots = { version = "1", optional = true }
pem = "3.0"
thiserror = "2.0"
x509-parser = "0.18"
chrono = { version = "0.4.24", default-features = false, features = ["clock"] }
async-trait = "0.1.53"
rustls = { version = "0.23", default-features = false }
time = "0.3.36"                                                                 # force the transitive dependency to a more recent minimal version. The build fails with 0.3.20

tokio = { version = "1.20.1", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "tls12",
] }
reqwest = { version = "0.13", default-features = false, features = [
    "rustls-no-provider",
] }

# Axum
axum-server = { version = "0.8", features = ["tokio-rustls"], optional = true }

[dependencies.proc-macro2]
# This is a transitive dependency, we specify it to make sure we have
# a recent-enough version so that -Z minimal-versions crate resolution
# works.
version = "1.0.78"

[dependencies.num-bigint]
# This is a transitive dependency, we specify it to make sure we have
# a recent-enough version so that -Z minimal-versions crate resolution
# works.
version = "0.4.4"

[dev-dependencies]
simple_logger = "5.0"
clap = { version = "4", features = ["derive"] }
axum = "0.8"
tokio = { version = "1.19.2", features = ["full"] }
tokio-stream = { version = "0.1.9", features = ["net"] }
tokio-util = { version = "0.7.3", features = ["compat"] }
warp = "0.3"
tempfile = "3"
pem = "3.0"
x509-parser = "0.18"
# Pulled in only for the integration tests so they can construct a
# `CryptoProvider` regardless of which crate features are enabled. Cargo
# applies dev-dep features to test/example/bench builds only, so this does
# not enable rustls's `ring` feature in downstream library builds.
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "doc_auto_cfg"]

[features]
default = ["tls-webpki-roots", "tls-ring"]
axum = ["dep:axum-server"]
tls-webpki-roots = ["dep:webpki-roots"]
# Picks the ring rustls crypto provider for `AcmeConfig::new`. Takes
# precedence over `tls-aws-lc-rs` when both are enabled.
tls-ring = ["rustls/ring", "tokio-rustls/ring"]
# Picks the aws-lc-rs rustls crypto provider for `AcmeConfig::new` when
# `tls-ring` is not also enabled.
tls-aws-lc-rs = ["rustls/aws-lc-rs", "tokio-rustls/aws-lc-rs"]

[[example]]
name = "low_level_axum"
required-features = ["axum"]

[[example]]
name = "high_level_warp"

[[example]]
name = "high_level"

[[example]]
name = "low_level"
