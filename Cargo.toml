[package]
name = "tokio-rustls-acme"
version = "0.10.0"
authors = [
    "dignifiedquire <me@dignifiedquire.com>",
    "Florian Uekermann <florian@uekermann.me>",
]
edition = "2024"
description = "Automatic TLS certificate management using rustls"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/n0-computer/tokio-rustls-acme"
documentation = "https://docs.rs/tokio-rustls-acme"
keywords = ["acme", "rustls", "tls", "letsencrypt"]
categories = ["asynchronous", "cryptography", "network-programming"]

[dependencies]
futures-core = "0.3"
n0-future = "0.3.2"
rcgen = { version = "0.14", default-features = false, features = ["pem"] }
serde_json = "1.0.81"
serde = { version = "1.0.137", features = ["derive"] }
ring = { version = "0.17.12", features = ["std"], optional = true }
aws-lc-rs = { version = "1.18", optional = true }
base64 = "0.23"
tracing = "0.1.44"
webpki-roots = { version = "1.0.10", optional = true }
pem = "4.0"
thiserror = "2.0"
x509-parser = "0.18"
async-trait = "0.1.53"
rustls = { version = "0.23.46", default-features = false }
time = "0.3.47"
tokio = { version = "1.20.1", default-features = false, features = ["fs", "rt", "time"] }
tempfile = { version = "3.10", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "tls12",
] }
reqwest = { version = "0.13", default-features = false, features = [
    "rustls-no-provider",
] }
# transitive dependency, updated to fix deny warning, remove after reqwest updates
url = "2.5.9"

# Axum
axum-server = { version = "0.9", features = ["tokio-rustls"], optional = true }

[dependencies.num-bigint]
# This is a transitive dependency, we specify it to make sure we have
# a recent-enough version so that -Z minimal-versions crate resolution
# works.
version = "0.4.4"

[dependencies.rustls-webpki]
# This is a transitive dependency of rustls, which verifies the ACME
# server certificate. rustls 0.23.46 admits 0.103.14, but versions
# before 0.103.16 accept distrusted emSign intermediates
# (RUSTSEC-2026-0382).
version = "0.103.16"
default-features = false

[dependencies.h2]
# Transitive through axum-server. Versions before 0.4.16 queue empty
# DATA frames without limit (RUSTSEC-2026-0258).
version = "0.4.16"
default-features = false
optional = true

[dev-dependencies]
tracing-subscriber = "0.3.23"
clap = { version = "4", features = ["derive"] }
axum = "0.8"
# `test-util` gives tests a paused clock.
tokio = { version = "1.19.2", features = ["full", "test-util"] }
tokio-stream = { version = "0.1.9", features = ["net"] }
tokio-util = { version = "0.7.3", features = ["compat"] }
warp = "0.4"
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }
tempfile = "3"
# `verify` checks the challenge certificate self-signature in tests.
x509-parser = { version = "0.18", features = ["verify"] }
# Pulled in only for the integration tests so they can construct a
# `CryptoProvider` regardless of which crate features are enabled. Cargo
# applies dev-dep features to test/example/bench builds only, so this does
# not enable rustls's `ring` feature in downstream library builds.
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "doc_auto_cfg"]

[package.metadata.cargo_check_external_types]
allowed_external_types = [
    "axum_server::*",
    "futures_core::*",
    "rustls::*",
    "serde_core::*",
    "tokio::*",
    "tokio_rustls",
    "tokio_rustls::*",
]

[features]
default = ["tls-webpki-roots", "tls-ring"]
axum = ["dep:axum-server", "dep:h2"]
tls-webpki-roots = ["dep:webpki-roots"]
# At least one of `tls-ring` or `tls-aws-lc-rs` must be enabled. The
# selected backend signs ACME requests, generates keys, and provides the
# rustls crypto provider for `AcmeConfig::new`.
#
# Selects ring when `tls-aws-lc-rs` is not also enabled.
tls-ring = ["dep:ring", "rcgen/ring", "rustls/ring", "x509-parser/verify"]
# Selects aws-lc-rs. Takes precedence over `tls-ring` when both are
# enabled, because rcgen makes the same choice.
tls-aws-lc-rs = ["dep:aws-lc-rs", "rcgen/aws_lc_rs", "rustls/aws-lc-rs", "x509-parser/verify-aws"]

[[example]]
name = "low_level_axum"
required-features = ["axum", "tls-webpki-roots"]

[[example]]
name = "high_level_warp"
required-features = ["tls-webpki-roots"]

[[example]]
name = "high_level"
required-features = ["tls-webpki-roots"]

[[example]]
name = "low_level"
required-features = ["tls-webpki-roots"]

[lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"

[lints.clippy]
allow_attributes_without_reason = "warn"
unused_async = "warn"
