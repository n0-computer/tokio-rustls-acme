[bans]
multiple-versions = "allow"
deny = ["native-tls", "openssl"]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",            # Community Data License Agreement Permissive 2.0 due to webpki-root-certs
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",                      # https://unlicense.org/
]

[advisories]
yanked = "deny"
ignore = []

[sources]
allow-git = []
