name: tests

on:
  pull_request:
  push:
    branches:
      - main

env:
  MSRV: "1.63"
  RUST_BACKTRACE: 1
  # Denies warnings like RUSTFLAGS=-Dwarnings, without changing the build cache key.
  CARGO_BUILD_WARNINGS: deny
  NEXTEST_PROFILE: ci
  NEXTEST_VERSION: "0.9.80"
  CARGO_MAKE_VERSION: "0.37.24"

# Default to read-only; jobs that need more grant it explicitly.
permissions:
  contents: read

# A new push to a pull request supersedes the runs for the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: [self-hosted, linux, X64]
    env:
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-make@${{ env.CARGO_MAKE_VERSION }}
      - run: cargo make format-check
      - run: cargo make clippy

  # All features on each OS. The feature-combos jobs test each crypto backend alone on Linux.
  test:
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: [self-hosted, linux, X64]
            toolchain: "x86_64-unknown-linux-gnu"
            name: "Linux GNU"
          - os: [self-hosted, macOS, ARM64]
            toolchain: "x86_64-apple-darwin"
            name: "macOS"
          - os: [self-hosted, windows, x64]
            toolchain: "x86_64-pc-windows-msvc"
            name: "Windows MSVC"
        channel:
          - "stable"
    env:
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        if: runner.os != 'Windows'
        with:
          toolchain: ${{ matrix.channel }}
          targets: ${{ matrix.target.toolchain }}
      # dtolnay/rust-toolchain needs bash, which is broken on the self-hosted Windows runners.
      - name: Install Rust (Windows)
        if: runner.os == 'Windows'
        env:
          RUST_TOOLCHAIN: ${{ matrix.channel }}
          RUST_TARGET: ${{ matrix.target.toolchain }}
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --target $env:RUST_TARGET
          rustup default $env:RUST_TOOLCHAIN
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        if: runner.os != 'Windows'
        with:
          tool: cargo-make@${{ env.CARGO_MAKE_VERSION }},nextest@${{ env.NEXTEST_VERSION }}
      # taiki-e/install-action needs bash too. The runners are shared, so install into RUNNER_TEMP.
      - name: Install cargo-make and nextest (Windows)
        if: runner.os == 'Windows'
        run: |
          $bin = Join-Path $env:RUNNER_TEMP "bin"
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          $nextest = Join-Path $env:RUNNER_TEMP "nextest.zip"
          Invoke-WebRequest -OutFile $nextest "https://get.nexte.st/$env:NEXTEST_VERSION/windows"
          Expand-Archive -Path $nextest -DestinationPath $bin -Force
          $make = Join-Path $env:RUNNER_TEMP "cargo-make.zip"
          Invoke-WebRequest -OutFile $make "https://github.com/sagiegurari/cargo-make/releases/download/$env:CARGO_MAKE_VERSION/cargo-make-v$env:CARGO_MAKE_VERSION-x86_64-pc-windows-msvc.zip"
          Expand-Archive -Path $make -DestinationPath $bin -Force
          Add-Content -Path $env:GITHUB_PATH -Value $bin
      - run: cargo make test

  # Checks that each feature set builds without the features that dev-dependencies add and
  # without the other crypto backend, and runs the tests, doctests and Pebble tests for each
  # backend alone.
  feature-combos:
    runs-on: [self-hosted, linux, X64]
    strategy:
      fail-fast: false
      matrix:
        include:
          # `absent`: crypto backend that must not be in the dependency tree.
          # `tests`: run the tests and Pebble tests. The test job covers all features.
          - name: "ring only"
            features: "tls-webpki-roots,tls-ring"
            absent: "aws-lc-rs"
            tests: true
          - name: "aws-lc-rs only"
            features: "tls-webpki-roots,tls-aws-lc-rs"
            absent: "ring"
            tests: true
          - name: "all features"
            features: "axum,tls-webpki-roots,tls-ring,tls-aws-lc-rs"
            tests: false
    name: feature-combos (${{ matrix.name }})
    env:
      RUSTC_WRAPPER: "sccache"
      TEST_FEATURES: ${{ matrix.features }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-make@${{ env.CARGO_MAKE_VERSION }},nextest@${{ env.NEXTEST_VERSION }}
      - run: cargo make check-lib
      - name: other backend absent from dependency tree
        if: matrix.absent
        env:
          ABSENT: ${{ matrix.absent }}
        run: |
          tree=$(cargo tree --locked -e normal,build --no-default-features --features "$TEST_FEATURES" --prefix none --format '{p}')
          if awk '{print $1}' <<<"$tree" | grep -qx "$ABSENT"; then
            echo "$ABSENT is in the dependency tree for features $TEST_FEATURES"
            exit 1
          fi
      - if: matrix.tests
        run: cargo make test
      - run: cargo make test-doc
      - if: matrix.tests
        run: cargo make test-pebble

  minimal-crates:
    runs-on: [self-hosted, linux, X64]
    env:
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - name: cargo check
        run: |
          rm -f Cargo.lock
          cargo +nightly check -Z minimal-versions -Z min-publish-age \
            --config 'registry.global-min-publish-age="3 days"' \
            --workspace --all-features --lib --bins

  cargo-deny:
    runs-on: [self-hosted, linux, X64]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --workspace --all-features
          command: check
          command-arguments: "-Dwarnings"

  check_external_types:
    timeout-minutes: 30
    name: Check external types in public API
    runs-on: [self-hosted, linux, X64]
    env:
      RUSTC_WRAPPER: "sccache"
      # The tool drives an internal rustdoc invocation that only emits JSON
      # for the analyzer, so denying warnings would just turn unrelated
      # rustdoc lints (e.g. `private-intra-doc-links`) into hard failures
      # here. Allow them for this job.
      RUSTDOCFLAGS: ""
      CARGO_BUILD_WARNINGS: allow
      # Pin to the nightly that the pinned `cargo-check-external-types`
      # release was last tested against. Update both together.
      CARGO_CHECK_EXTERNAL_TYPES_VERSION: "0.5.0"
      TOOLCHAIN: "nightly-2026-03-20"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.TOOLCHAIN }}
      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Install cargo-check-external-types
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: |
            cargo-make
            cargo-check-external-types@${{ env.CARGO_CHECK_EXTERNAL_TYPES_VERSION }}

      - name: Check external types
        run: cargo make check-external-types
