[env]
# Crate features for the pebble tests. CI runs them once per crypto backend.
PEBBLE_FEATURES = { value = "tls-webpki-roots,tls-ring", condition = { env_not_set = ["PEBBLE_FEATURES"] } }

[tasks.pebble-up]
description = "Start Pebble ACME test servers"
script = '''
docker compose -f docker-compose.pebble.yml up -d
echo "Waiting for Pebble to be ready..."
for port in 14000 14001; do
    ready=
    for i in $(seq 1 30); do
        if curl -sk https://localhost:$port/dir > /dev/null 2>&1; then
            ready=1
            break
        fi
        sleep 1
    done
    if [ -z "$ready" ]; then
        echo "Pebble on port $port failed to start"
        exit 1
    fi
done
echo "Pebble is ready"
'''

[tasks.pebble-down]
description = "Stop Pebble ACME test servers"
script = '''
docker compose -f docker-compose.pebble.yml down
rm -f pebble.minica.pem
'''

[tasks.pebble-cert]
description = "Extract Pebble minica root cert (the same for both instances)"
dependencies = ["pebble-up"]
script = '''
docker compose -f docker-compose.pebble.yml cp pebble:/test/certs/pebble.minica.pem ./pebble.minica.pem
'''

[tasks.pebble-test-run]
description = "Run Pebble integration tests"
dependencies = ["pebble-cert"]
env = { "PEBBLE_MINICA_CERT" = "./pebble.minica.pem" }
command = "cargo"
args = [
    "test",
    "--locked",
    "--no-default-features",
    "--features",
    "${PEBBLE_FEATURES}",
    "--test",
    "pebble",
    "--",
    "--ignored",
    "--nocapture",
]

[tasks.test]
clear = true
description = "Run Pebble integration tests e2e (start server, test, stop)"
run_task = { name = ["pebble-test-run"], fork = true, cleanup_task = "pebble-down" }

[tasks.check-external-types]
description = "Run cargo check-external-types on workspace crates"
workspace = true
# cargo check-external-types needs a specific nightly toolchain,
# see https://github.com/awslabs/cargo-check-external-types#how-to-use
toolchain = "${TOOLCHAIN:nightly-2026-03-20}"
command = "cargo"
install_crate = false
args = ["check-external-types", "--all-features"]

[tasks.test-ring]
description = "Run tests with only the ring crypto provider feature enabled"
command = "cargo"
args = [
    "test",
    "--locked",
    "--no-default-features",
    "--features",
    "tls-webpki-roots,tls-ring",
]

[tasks.test-aws-lc-rs]
description = "Run tests with only the aws-lc-rs crypto provider feature enabled"
command = "cargo"
args = [
    "test",
    "--locked",
    "--no-default-features",
    "--features",
    "tls-webpki-roots,tls-aws-lc-rs",
]

[tasks.test-both-providers]
description = "Run tests with both ring and aws-lc-rs crypto provider features enabled"
command = "cargo"
args = [
    "test",
    "--locked",
    "--no-default-features",
    "--features",
    "tls-webpki-roots,tls-ring,tls-aws-lc-rs",
]

[tasks.test-feature-combos]
description = "Run the full crypto provider feature matrix the CI uses"
dependencies = [
    "test-ring",
    "test-aws-lc-rs",
    "test-both-providers",
]
