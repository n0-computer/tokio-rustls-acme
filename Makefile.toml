[env]
# Crate features for the pebble tests. CI runs them once per crypto backend.
PEBBLE_FEATURES = { value = "tls-webpki-roots,tls-ring", condition = { env_not_set = ["PEBBLE_FEATURES"] } }

[tasks.pebble-install]
description = "Download the Pebble and challtestsrv binaries to target/pebble"
env = { "PEBBLE_VERSION" = "v2.10.3" }
script = '''
set -eu
dir=target/pebble
if [ "$(cat "$dir/version" 2>/dev/null)" = "$PEBBLE_VERSION" ]; then
    exit 0
fi
case "$(uname -s)-$(uname -m)" in
    Linux-x86_64) platform=linux-amd64 ;;
    Linux-aarch64) platform=linux-arm64 ;;
    Darwin-x86_64) platform=darwin-amd64 ;;
    Darwin-arm64) platform=darwin-arm64 ;;
    *) echo "No Pebble release for $(uname -s) $(uname -m)"; exit 1 ;;
esac
if command -v sha256sum > /dev/null; then
    sha256="sha256sum"
else
    sha256="shasum -a 256"
fi
mkdir -p "$dir"
for name in pebble pebble-challtestsrv; do
    archive="$name-$platform.tar.gz"
    curl -sSfL -o "$dir/$archive" \
        "https://github.com/letsencrypt/pebble/releases/download/$PEBBLE_VERSION/$archive"
    grep " $archive\$" test/pebble.sha256 | (cd "$dir" && $sha256 -c -)
    tar -xzf "$dir/$archive" -C "$dir" --strip-components 3
    chmod +x "$dir/$name"
    rm "$dir/$archive"
done
echo "$PEBBLE_VERSION" > "$dir/version"
'''

[tasks.pebble-test-run]
description = "Run Pebble integration tests"
dependencies = ["pebble-install"]
command = "cargo"
args = [
    "test",
    "--locked",
    "--no-default-features",
    "--features",
    "${PEBBLE_FEATURES}",
    "--test",
    "pebble",
    "--",
    "--ignored",
    "--nocapture",
]

[tasks.test]
clear = true
description = "Run Pebble integration tests e2e (install Pebble, test)"
run_task = "pebble-test-run"

[tasks.check-external-types]
description = "Run cargo check-external-types on workspace crates"
workspace = true
# cargo check-external-types needs a specific nightly toolchain,
# see https://github.com/awslabs/cargo-check-external-types#how-to-use
toolchain = "${TOOLCHAIN:nightly-2026-03-20}"
command = "cargo"
install_crate = false
args = ["check-external-types", "--all-features"]

[tasks.test-ring]
description = "Run tests with only the ring crypto provider feature enabled"
command = "cargo"
args = [
    "test",
    "--locked",
    "--no-default-features",
    "--features",
    "tls-webpki-roots,tls-ring",
]

[tasks.test-aws-lc-rs]
description = "Run tests with only the aws-lc-rs crypto provider feature enabled"
command = "cargo"
args = [
    "test",
    "--locked",
    "--no-default-features",
    "--features",
    "tls-webpki-roots,tls-aws-lc-rs",
]

[tasks.test-both-providers]
description = "Run tests with both ring and aws-lc-rs crypto provider features enabled"
command = "cargo"
args = [
    "test",
    "--locked",
    "--no-default-features",
    "--features",
    "tls-webpki-roots,tls-ring,tls-aws-lc-rs",
]

[tasks.test-feature-combos]
description = "Run the full crypto provider feature matrix the CI uses"
dependencies = [
    "test-ring",
    "test-aws-lc-rs",
    "test-both-providers",
]
